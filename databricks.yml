bundle:
  name: shopstream

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this environment

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-439dccc0-5070.cloud.databricks.com/
    variables:
      catalog: dev_shop

  stg:
    mode: production
    workspace:
      host: https://dbc-439dccc0-5070.cloud.databricks.com/
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: stg_shop

  prd:
    mode: production
    workspace:
      host: https://dbc-439dccc0-5070.cloud.databricks.com/
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prd_shop