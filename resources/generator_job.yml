resources:
  jobs:
    data_generator:
      name: shopstream-data-generator
      description: Writes synthetic, deliberately messy e-commerce batches into the landing volume
      tags:
        project: shopstream
        layer: source-simulation
      tasks:
        - task_key: generate
          environment_key: generator_env
          spark_python_task:
            python_file: ../src/generator/main.py
            parameters:
              - --output-path
              - /Volumes/${var.catalog}/${resources.schemas.landing.name}/${resources.volumes.raw_files.name}
              - --batches
              - "3"
      environments:
        - environment_key: generator_env
          spec:
            environment_version: "2"
            dependencies:
              - faker
